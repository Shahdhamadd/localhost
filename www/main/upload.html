<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Upload</title>
<link rel="stylesheet" href="/style.css"><link rel="icon" href="/logo.svg">
</head>
<body>
<h1>Upload a file</h1>
<form action="/uploads/" method="POST" enctype="multipart/form-data">
<input type="file" name="file">
<button type="submit">Upload</button>
</form>

<h2>Uploaded files</h2>
<ul id="files"><li>Loading…</li></ul>
<p id="message"></p>

<p><a href="/uploads/">Plain directory listing</a> · <a href="/">Back home</a></p>
<script src="/script.js"></script>
</body>
</html>
