server {
    host 0.0.0.0
    ports 8080 8081
    server_name localhost
    client_max_body_size 1000000
    error_page 400 www/errors/400.html
    error_page 403 www/errors/403.html
    error_page 404 www/errors/404.html
    error_page 405 www/errors/405.html
    error_page 413 www/errors/413.html
    error_page 500 www/errors/500.html

    route / {
        root www/main
        methods GET
        index index.html
        listing off
    }

    route /files {
        root www/main/files
        methods GET
        listing on
    }

    route /uploads {
        root www/main/uploads
        methods GET POST DELETE
        listing on
    }

    route /old {
        redirect /
    }

    route /cgi {
        root www/main/cgi
        methods GET POST
        cgi .py python3
        cgi .pl perl
    }
}

server {
    host 0.0.0.0
    ports 8080
    server_name test.com
    client_max_body_size 10
    route / {
        root www/test
        methods GET POST
        index index.html
    }
}

server {
    host 0.0.0.0
    ports 9000
    server_name admin
    route / {
        root www/admin
        index index.html
    }
}
